# pick.sh does the work, with semver-tool 3.4.0 (https://github.com/fsaintjacques/semver-tool,
# Apache-2.0, vendored unmodified as ./semver; see README.md).
name: next-version
description: >-
  Pick the next version from the repository's tags: bump the latest vX.Y.Z tag (or another tag
  prefix's) by patch, minor or major, or check an exact version. Fails if the version is already a
  tag, if it is not newer than the latest (unless require-newer is false), or if it is a prerelease
  (unless allow-prerelease).

inputs:
  bump:
    description: patch, minor or major; ignored when version is set
    required: false
    default: patch
  version:
    description: >-
      Exact version, X.Y.Z (or X.Y.Z-PRERELEASE with allow-prerelease), with or without the tag
      prefix; overrides bump
    required: false
    default: ""
  tag-prefix:
    description: >-
      What comes before the version in a tag: v for vX.Y.Z, name-v for name-vX.Y.Z, or empty for
      tags without a prefix. Only tags with it count.
    required: false
    default: v
  require-newer:
    description: >-
      Require the version to be newer than the latest release tag. Set it to false for a patch to an
      older minor version, say.
    required: false
    default: "true"
  allow-prerelease:
    description: Allow an exact version with a prerelease part, X.Y.Z-PRERELEASE
    required: false
    default: "false"
  repository:
    description: The repository whose tags to read, owner/name
    required: false
    default: ${{ github.repository }}
  token:
    description: Token for reading the tags
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The version, X.Y.Z (or X.Y.Z-PRERELEASE), without the tag prefix
    value: ${{ steps.pick.outputs.version }}
  tag:
    description: The version's tag, the tag prefix followed by the version
    value: ${{ steps.pick.outputs.tag }}
  latest:
    description: The latest release tag (prereleases do not count), or the tag of 0.0.0 without one
    value: ${{ steps.pick.outputs.latest }}
  make-latest:
    description: >-
      true when the version is a release newer than every release tag, so it should be marked the
      Latest release: pass it to gh release create --latest, or the API's make_latest
    value: ${{ steps.pick.outputs.make-latest }}
  prerelease:
    description: true when the version is X.Y.Z-PRERELEASE
    value: ${{ steps.pick.outputs.prerelease }}
  previous:
    description: >-
      The tag its release notes start at: the highest tag below the version (only release tags for
      a release, prereleases too for a prerelease); empty without one
    value: ${{ steps.pick.outputs.previous }}

runs:
  using: composite
  steps:
    - name: Pick the version
      id: pick
      shell: bash
      env:
        BUMP: ${{ inputs.bump }}
        VERSION: ${{ inputs.version }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        REQUIRE_NEWER: ${{ inputs.require-newer }}
        ALLOW_PRERELEASE: ${{ inputs.allow-prerelease }}
        REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        gh api --paginate "repos/$REPOSITORY/tags" --jq '.[].name' \
          | "$GITHUB_ACTION_PATH/pick.sh"

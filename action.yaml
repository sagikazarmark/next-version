# pick.sh does the work, with semver-tool 3.4.0 (https://github.com/fsaintjacques/semver-tool,
# Apache-2.0, vendored unmodified as ./semver; see README.md).
name: next-version
description: >-
  Pick the next version from the repository's tags: bump the latest vX.Y.Z tag by patch, minor or
  major, or check an exact version. Fails if the version is already a tag, if it is not newer than
  the latest (unless require-newer is false), or if it is a prerelease (unless allow-prerelease).

inputs:
  bump:
    description: patch, minor or major; ignored when version is set
    required: false
    default: patch
  version:
    description: Exact version, vX.Y.Z (or vX.Y.Z-PRERELEASE with allow-prerelease); overrides bump
    required: false
    default: ""
  require-newer:
    description: >-
      Require the version to be newer than the latest vX.Y.Z tag. Set it to false for a patch to an
      older minor version, say.
    required: false
    default: "true"
  allow-prerelease:
    description: Allow an exact version with a prerelease part, vX.Y.Z-PRERELEASE
    required: false
    default: "false"
  repository:
    description: The repository whose tags to read, owner/name
    required: false
    default: ${{ github.repository }}
  token:
    description: Token for reading the tags
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The version
    value: ${{ steps.pick.outputs.version }}
  latest:
    description: The latest vX.Y.Z tag (prereleases do not count), or v0.0.0 without one
    value: ${{ steps.pick.outputs.latest }}
  make-latest:
    description: >-
      true when the version is a release newer than every vX.Y.Z tag, so it should be marked the
      Latest release: pass it to gh release create --latest, or the API's make_latest
    value: ${{ steps.pick.outputs.make-latest }}
  prerelease:
    description: true when the version is vX.Y.Z-PRERELEASE
    value: ${{ steps.pick.outputs.prerelease }}
  previous:
    description: >-
      Where its release notes start: the highest tag below the version (only vX.Y.Z tags for a
      release, prereleases too for a prerelease); empty without one
    value: ${{ steps.pick.outputs.previous }}

runs:
  using: composite
  steps:
    - name: Pick the version
      id: pick
      shell: bash
      env:
        BUMP: ${{ inputs.bump }}
        VERSION: ${{ inputs.version }}
        REQUIRE_NEWER: ${{ inputs.require-newer }}
        ALLOW_PRERELEASE: ${{ inputs.allow-prerelease }}
        REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        gh api --paginate "repos/$REPOSITORY/tags" --jq '.[].name' \
          | "$GITHUB_ACTION_PATH/pick.sh"
